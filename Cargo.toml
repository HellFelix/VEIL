[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/HellFelix/veil"
# Deployed as systemd units, not consumed from crates.io. This also lets the
# members depend on each other by path alone, with no duplicated version string.
publish = false

# The normative dependency allowlist (plan.md §5.2). A crate that is not listed
# here may not be declared by any workspace member, and members must inherit
# with `workspace = true` rather than naming a version. `scripts/check-deps.sh`
# enforces both halves of that rule; `deny.toml` bans the crates in §5.3.
[workspace.dependencies]
# Crypto and transport
# Features are named explicitly so the crypto provider is never selected by a
# default; VEIL uses aws-lc-rs everywhere.
quinn = { version = "0.11.11", default-features = false, features = [
  "rustls-aws-lc-rs",
  "runtime-tokio",
] }
# Pinned to the 0.23 line: quinn 0.11 links against rustls 0.23. `tls12` is
# deliberately absent, which makes "TLS 1.3 only" (plan.md §2) structural
# rather than a runtime check.
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "aws_lc_rs",
] }
rustls-pki-types = "1.15.1"
# Chosen at M1. Both providers expose `sign::any_eddsa_type`, so Ed25519 did
# not decide it; aws-lc-rs is rustls' own default and the best-tested path.
aws-lc-rs = "1.17.3"
ed25519-dalek = { version = "3.0.0", features = [
  "pkcs8",
  "rand_core",
  "zeroize",
] }
rand = "0.10.2"
rand_core = "0.10.1"
zeroize = "1.9.0"
base64 = "0.23.0"

# Async runtime
tokio = { version = "1.53.1", features = [
  "net",
  "io-util",
  "sync",
  "time",
  "signal",
  "macros",
  "rt-multi-thread",
] }
tokio-util = { version = "0.7.19", features = ["codec"] }
futures-util = "0.3.33"
bytes = "1.12.1"

# Serialization and config
serde = { version = "1.0.229", features = ["derive"] }
postcard = "1.1.3"
toml = "1.1.4"
# Format-preserving TOML, from the same release line as `toml` above
# (+spec-1.1.0). Amends plan.md §5.2: `veil-ctl peer` edits a file the operator
# also hand-writes, and serializing our own structs back out would delete every
# comment in it. §2 chose TOML precisely because it is diffable and
# version-controllable. Adds exactly one crate to the graph; every one of its
# own dependencies is already in Cargo.lock.
toml_edit = "0.25.13"
serde_json = "1.0.151"

# Web
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs"] }
rust-embed = "8.12.0"

# Plumbing
libc = "0.2.189"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
thiserror = "2.0.19"
clap = { version = "4.6.5", features = ["derive"] }
ipnet = "2.12.0"

# Dev-dependencies (plan.md §5.2)
proptest = "1.11.0"
tempfile = "3.27.0"

# Internal crates. The two daemons are libraries as well as binaries so that
# `veil-ctl serve` and `veil-ctl connect` run them in-process, with no second
# binary to locate on PATH and no exit code to relay.
veil-clientd = { path = "crates/veil-clientd" }
veil-common = { path = "crates/veil-common" }
veil-config = { path = "crates/veil-config" }
veil-crypto = { path = "crates/veil-crypto" }
veil-net = { path = "crates/veil-net" }
veil-proto = { path = "crates/veil-proto" }
veild = { path = "crates/veild" }

# plan.md §4. v1 had roughly fifteen `unwrap`s on the data path, several
# reachable by a single malformed packet; this is the structural answer.
# `expect_used` is relaxed at individual `main()` startup sites and in tests.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.rust]
missing_docs = "warn"
